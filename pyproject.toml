[project]
name = "dani"
version = "0.0.1"
description = "Experimental local-first GitHub webhook automation for Gajae-Code and Codex agents"
authors = [{ name = "NomaDamas", email = "vkehfdl1@gmail.com" }]
readme = "README.md"
license = "MIT"
keywords = ["agent", "automation", "codex", "gajae-code", "github", "webhook"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.118.0",
    "PyGithub>=2.8.1,<3",
    "typer>=0.19.2",
    "uvicorn>=0.37.0",
]

[project.scripts]
dani = "dani.cli:app"

[project.urls]
Homepage = "https://github.com/NomaDamas/dani"
Repository = "https://github.com/NomaDamas/dani"
Documentation = "https://github.com/NomaDamas/dani"
Issues = "https://github.com/NomaDamas/dani/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.29.0",
    "deptry>=0.24.0",
    "ty>=0.0.14",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dani"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "SIM",
    "I",
    "C90",
    "E", "W",
    "F",
    "PGH",
    "UP",
    "RUF",
    "TRY",
]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"tests/test_release_surface.py" = ["S101", "S105", "S106", "S603", "S607"]
"dani/codex_runner.py" = ["S607"]
"dani/gajae_runner.py" = ["S603"]
"scripts/dev/**" = ["S101", "S108", "S603", "S607", "T201"]

[tool.ruff.format]
preview = true
